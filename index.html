<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soren Rho | Project Management</title>
<meta name="description" content="Soren Rho project management: scope, vendor bids, scheduling, oversight and sign-off, handled from start to finish.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12283a;
  --navy-deep:#0d1d2b;
  --teal:#2a5a66;
  --teal-soft:#9fd3db;
  --ink:#20272e;
  --soft:#5a6670;
  --paper:#f5f1e8;
  --maxw:1180px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--navy);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--teal);text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:12px;top:12px;position:fixed;z-index:100;background:#fff;color:var(--navy);border-radius:10px;padding:10px 14px}

.header{
  position:relative;
  z-index:2;
  background:rgba(245,241,232,.92);
  border-bottom:1px solid rgba(18,40,58,.10);
}
.header .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:16px;padding-bottom:16px}
.brand{
  display:inline-flex;align-items:center;gap:12px;
  color:var(--navy);
  font-family:'Newsreader',serif;font-size:1.24rem;font-weight:600;
}

.hero{
  position:relative;
  flex:1;
  overflow:hidden;
  display:flex;
  align-items:center;
  background:var(--navy);
}
.hero video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.45;filter:saturate(.82);
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(108deg, rgba(13,29,43,.94) 0%, rgba(13,29,43,.76) 50%, rgba(13,29,43,.38) 100%),
    radial-gradient(circle at 76% 22%, rgba(159,211,219,.22), transparent 26%);
}
.hero .wrap{position:relative;z-index:2;padding-top:96px;padding-bottom:110px}
h1{
  margin:0 0 24px;
  color:#fff;
  font-family:'Newsreader',serif;
  font-size:clamp(3rem,7vw,5.5rem);
  line-height:.93;
  letter-spacing:-.025em;
  max-width:11ch;
}
.lede{max-width:35rem;margin:0;color:rgba(255,255,255,.84);font-size:1.13rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:52px;margin-top:36px;padding:0 22px;
  border-radius:999px;
  background:#fff;color:var(--navy);
  font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  transition:transform .2s ease, background .2s ease;
}
.btn:hover,.btn:focus-visible{background:var(--teal-soft);color:var(--navy-deep);transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--teal-soft);outline-offset:3px}

footer{
  background:var(--navy-deep);
  color:rgba(255,255,255,.62);
  font-size:.85rem;
  padding:28px 0;
}
footer p{margin:0 0 6px}
footer a{color:rgba(255,255,255,.85)}
@media (prefers-reduced-motion: reduce){ .hero video{display:none} }
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>

<header class="header">
  <div class="wrap">
    <a href="index.html" class="brand" aria-label="Soren Rho home">
      <svg width="20" height="30" viewBox="0 0 28 40" fill="none" aria-hidden="true">
        <path d="M9 38 L12 12 L16 12 L19 38 Z" stroke="#12283a" stroke-width="2" stroke-linejoin="round"/>
        <line x1="10.2" y1="28" x2="17.8" y2="28" stroke="#12283a" stroke-width="1.4"/>
        <line x1="11" y1="20" x2="17" y2="20" stroke="#12283a" stroke-width="1.4"/>
        <rect x="10.5" y="5" width="7" height="7" stroke="#12283a" stroke-width="2"/>
        <path d="M9.5 5 L14 1 L18.5 5 Z" fill="#12283a"/>
        <line x1="6" y1="38" x2="22" y2="38" stroke="#12283a" stroke-width="2"/>
        <line x1="10.5" y1="8.5" x2="4" y2="6.5" stroke="#2a5a66" stroke-width="1.3"/>
        <line x1="17.5" y1="8.5" x2="24" y2="6.5" stroke="#2a5a66" stroke-width="1.3"/>
      </svg>
      Soren Rho
    </a>
  </div>
</header>

<main id="main" class="hero">
  <video autoplay muted loop playsinline preload="metadata" poster="lighthouse-poster.jpg" aria-hidden="true">
    <source src="lighthouse-hero.webm" type="video/webm">
    <source src="lighthouse-hero.mp4" type="video/mp4">
  </video>
  <div class="wrap">
    <h1>Project management. Period.</h1>
    <p class="lede">We take the whole project, from scope and vendors to schedules and sign-off, and steer it to done so you don't have to manage every piece yourself.</p>
    <a class="btn" href="mailto:hello@sorenrho.com">Get in touch</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <p><a href="mailto:hello@sorenrho.com">hello@sorenrho.com</a> &middot; <a href="terms.html">Terms</a> &middot; <a href="privacy.html">Privacy</a></p>
    <p>&copy; 2026 Soren Rho</p>
  </div>
</footer>
</body>
</html>
